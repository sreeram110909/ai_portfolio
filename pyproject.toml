[project]
name = "ai-portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
